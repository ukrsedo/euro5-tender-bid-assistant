name: Build analysis and protected Cloudflare Worker ZIPs

on:
  workflow_dispatch:
  push:
    paths:
      - 'access-worker.js'
      - 'app.js'
      - 'index.html'
      - 'buyer-card.js'
      - 'tests/**'
      - 'worker.js'
      - 'document-reader.js'
      - 'auth/**'
      - '.github/workflows/build-worker-zip.yml'

permissions:
  contents: write

concurrency:
  group: euro5-worker-downloads
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker document extraction libraries
        run: npm install --no-save --no-package-lock unpdf@1.9.1 fflate@0.8.3
      - name: Bundle both Cloudflare Worker services
        run: |
          mkdir -p dist
          npx --yes esbuild@0.25.12 worker.js --bundle --format=esm --platform=browser --external:cloudflare:workers --target=es2022 --outfile=dist/euro5-tender-analysis.js
          npx --yes esbuild@0.25.12 access-worker.js --bundle --format=esm --platform=browser --external:cloudflare:workers --target=es2022 --outfile=dist/euro5-tender-test.js
      - name: Check syntax and required fixes
        run: |
          node --check dist/euro5-tender-test.js
          node --check dist/euro5-tender-analysis.js
          node --check app.js
          node --check buyer-card.js
          npx --yes --package typescript@5.9.3 tsc --allowJs --checkJs --noEmit --skipLibCheck --lib es2022,dom --target es2022 --module esnext --moduleResolution node worker.js access-worker.js
          node --test tests/market-indicative.test.mjs tests/current-market.test.mjs tests/enkorr-archive.test.mjs tests/competition-panel.test.mjs tests/access-parity.test.mjs tests/prozorro-lookup-fallback.test.mjs tests/buyer-procedure-group.test.mjs tests/august-tender-regression.test.mjs tests/september-tender-regression.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const analysis=fs.readFileSync('dist/euro5-tender-analysis.js','utf8');
          const protectedCode=fs.readFileSync('dist/euro5-tender-test.js','utf8');
          if(!/worker_default as default/.test(analysis) || /access_worker_default as default/.test(analysis)) process.exit(1);
          if(!/access_worker_default as default/.test(protectedCode)) process.exit(1);
          if(!analysis.includes('enkorr-wholesale-history.json') || !analysis.includes('tender-check')) process.exit(1);
          if(!protectedCode.includes('origin && origin !== url.origin') && !protectedCode.includes('origin&&origin!==url.origin')) process.exit(1);
          const documentReaderMarkers = ['MAX_DOCUMENT_REDIRECTS', 'isTrustedProzorroDocumentUrl', 'openprocurement.org'];
          for (const marker of documentReaderMarkers) {
            if (!analysis.includes(marker)) throw new Error('Analysis Worker is missing document-reader policy: ' + marker);
          }
          const readerSource = fs.readFileSync('document-reader.js','utf8');
          const obsoleteRedirectError = 'Посилання перенаправляє за межі Prozorro.';
          const currentRedirectError = 'Посилання перенаправляє на неперевірений домен.';
          if (readerSource.includes(obsoleteRedirectError) || !readerSource.includes(currentRedirectError)) {
            throw new Error('Source still contains the obsolete redirect rejection.');
          }
          if (!protectedCode.includes('TENDER_AI') || !protectedCode.includes('tender-check')) {
            throw new Error('Protected Worker is not proxying tender analysis to the shared analysis Worker.');
          }
          console.log('Analysis and protected Worker entrypoints verified with matching document-reader policy');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: euro5-worker-services
          path: |
            dist/euro5-tender-analysis.js
            dist/euro5-tender-test.js
          retention-days: 30
      - name: Publish direct-download JS and ZIP in repository
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p downloads
          cp dist/euro5-tender-test.js downloads/euro5-tender-test.js
          cp dist/euro5-tender-analysis.js downloads/euro5-tender-analysis.js
          zip -j -q downloads/euro5-tender-test.zip dist/euro5-tender-test.js
          zip -j -q downloads/euro5-tender-analysis.zip dist/euro5-tender-analysis.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/euro5-tender-analysis.js downloads/euro5-tender-analysis.zip downloads/euro5-tender-test.js downloads/euro5-tender-test.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Cloudflare Worker JS and ZIP [skip ci]"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
