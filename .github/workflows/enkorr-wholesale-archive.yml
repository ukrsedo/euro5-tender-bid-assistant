name: Archive Enkorr wholesale prices
on:
  schedule:
    - cron: '23 7,11,15,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/enkorr-wholesale.mjs'
      - 'scripts/archive-enkorr-wholesale.mjs'
      - '.github/workflows/enkorr-wholesale-archive.yml'
permissions:
  contents: write
concurrency:
  group: enkorr-wholesale-archive
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/archive-enkorr-wholesale.mjs
      - name: Save dated observation
        run: |
          if git diff --quiet -- data/enkorr-wholesale-history.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/enkorr-wholesale-history.json
          git commit -m 'Archive dated Enkorr wholesale prices [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
