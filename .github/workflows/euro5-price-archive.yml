name: Archive EURO5 retail prices
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/archive-euro5-prices.mjs'
      - 'scripts/euro5-retail.mjs'
      - '.github/workflows/euro5-price-archive.yml'
permissions:
  contents: write
concurrency:
  group: euro5-price-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/archive-euro5-prices.mjs
      - name: Save daily observation
        run: |
          if git diff --quiet -- data/euro5-retail-history.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/euro5-retail-history.json
          git commit -m 'Archive daily EURO5 retail prices'
          git pull --rebase origin main
          git push origin HEAD:main
